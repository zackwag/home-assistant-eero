[project]
name = "home-assistant-eero"
version = "1.0.0"
description = "Eero integration for Home Assistant"
license = "MIT"
requires-python = ">=3.13"

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = [
    "B",      # flake8-bugbear
    "E",      # pycodestyle
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "W",      # pycodestyle warnings
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.eero"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
