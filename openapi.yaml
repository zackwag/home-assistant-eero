components:
  schemas:
    NetworkForward:
      type: object
      properties:
        description:
          type: string
        enabled:
          type: boolean
        ip:
          type: string
        protocol:
          type: string
          enum: [tcp, udp, both]
        gateway_port:
          type: string
        client_port:
          type: string
    NetworkReservation:
      type: object
      properties:
        url:
          type: string
        description:
          type: string
        mac:
          type: string
        ip:
          type: string
        public_static_ip:
          type: string
